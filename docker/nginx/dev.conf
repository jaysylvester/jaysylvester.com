# Development reverse proxy
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml;

    server {
        listen 80;
        server_name dev.jaysylvester.com localhost;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dev.jaysylvester.com localhost;

        ssl_certificate /etc/nginx/certs/dev-cert.pem;
        ssl_certificate_key /etc/nginx/certs/dev-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;

        location ^~ /browser-sync/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://assets:3000;
        }

        location = / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "for=$remote_addr;host=$host;proto=$scheme";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app:8080;
        }

        location / {
            try_files $uri @citizen;
            add_header Cache-Control "no-store" always;
            access_log off;
        }

        location @citizen {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "for=$remote_addr;host=$host;proto=$scheme";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app:8080;
        }
    }
}
