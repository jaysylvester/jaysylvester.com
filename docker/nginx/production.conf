# Production reverse proxy
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    multi_accept on;
    worker_connections 65535;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    log_not_found off;
    types_hash_max_size 2048;
    client_max_body_size 16M;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name jaysylvester.com;

        root /usr/share/nginx/html;

        ssl_certificate /etc/letsencrypt/live/jaysylvester.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jaysylvester.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/jaysylvester.com/chain.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        rewrite ^/work-history /resume permanent;
        rewrite ^/portfolio /work-samples permanent;
        rewrite ^/documents/portfolio(.*) /documents/work$1 permanent;
        rewrite ^/case-study/client(.*) /case-study$1 permanent;
        rewrite ^/case-study/company(.*) /case-study$1 permanent;
        rewrite ^/case-study/client/Znode /case-study/hibu permanent;
        rewrite ^/app/patterns/resume/resources(.*) /documents/resume$1 permanent;

        location ~ /\.(?!well-known) {
            deny all;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        location / {
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Forwarded "host=$host;proto=$scheme;for=$remote_addr";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_pass http://app:8080;
        }

        location ~* "\.[a-z0-9]{1,5}$" {
            try_files $uri $uri/ =404;
            expires 30d;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.jaysylvester.com;

        ssl_certificate /etc/letsencrypt/live/jaysylvester.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jaysylvester.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/jaysylvester.com/chain.pem;

        return 301 https://jaysylvester.com$request_uri;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name jaysylvester.com www.jaysylvester.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://jaysylvester.com$request_uri;
        }
    }
}
