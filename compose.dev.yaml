services:
  db:
    ports:
      - "127.0.0.1:${DB_CLIENT_PORT:-5432}:5432"

  app:
    image: jaysylvester-app:development
    volumes:
      - ./.env:/site/.env:ro
      - ./app:/site/app
      - ./citizen.config.js:/site/citizen.config.js:ro
      - ./logs:/site/logs
      - ./web:/site/web

  proxy:
    image: jaysylvester-proxy:development
    depends_on:
      assets:
        condition: service_started
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/dev-certs:/etc/nginx/certs:ro
      - ./web:/usr/share/nginx/html:ro

  assets:
    image: jaysylvester-app:development
    pull_policy: never
    command: ["npm", "run", "assets:watch"]
    environment:
      BROWSERSYNC_ORIGIN: ${BROWSERSYNC_ORIGIN:?Set BROWSERSYNC_ORIGIN in .env}
      GULP_USE_POLLING: ${GULP_USE_POLLING:-true}
      GULP_POLLING_INTERVAL: ${GULP_POLLING_INTERVAL:-500}
    expose:
      - "3000"
    init: true
    user: "10001:10001"
    volumes:
      - ./app:/site/app:ro
      - ./web:/site/web

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME:-jaysylvester-postgres}
