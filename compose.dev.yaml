services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTICO_PORT:-5432}:5432"

  app:
    build:
      target: development
    volumes:
      - ./.env:/site/.env:ro
      - ./app:/site/app
      - ./citizen.config.js:/site/citizen.config.js:ro
      - ./logs:/site/logs
      - ./web:/site/web

  proxy:
    build:
      args:
        NGINX_CONFIG: dev.conf
    depends_on:
      assets:
        condition: service_started
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./docker/dev-certs:/etc/nginx/certs:ro
      - ./web:/usr/share/nginx/html:ro

  assets:
    build:
      context: .
      target: development
    command: ["npm", "run", "assets:watch"]
    environment:
      BROWSERSYNC_ORIGIN: ${BROWSERSYNC_ORIGIN:?Set BROWSERSYNC_ORIGIN in .env}
      GULP_USE_POLLING: ${GULP_USE_POLLING:-true}
      GULP_POLLING_INTERVAL: ${GULP_POLLING_INTERVAL:-500}
    expose:
      - "3000"
    init: true
    user: "10001:10001"
    volumes:
      - ./app:/site/app
      - ./web:/site/web
