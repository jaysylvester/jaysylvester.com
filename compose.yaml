services:
  db:
    image: ${POSTGRES_IMAGE:?Set the inventoried and tested POSTGRES_IMAGE in .env}
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:?Set POSTGRES_INITDB_ARGS in .env}
      TZ: ${POSTGRES_TIMEZONE:?Set the inventoried POSTGRES_TIMEZONE in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: production
    command: ["node", "app/start.js"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "8080"
    init: true
    user: "10001:10001"
    volumes:
      - app-logs:/site/logs

  proxy:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        NGINX_CONFIG: local.conf
    depends_on:
      app:
        condition: service_started
    expose:
      - "80"
      - "443"
volumes:
  app-logs:
    name: ${COMPOSE_PROJECT_NAME}-logs
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres
